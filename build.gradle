plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Bawnorton Releases"
		url = "https://maven.bawnorton.com/releases"
	}
	maven {
		name = "Ladysnake Libs"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		url = "https://maven.cafeteria.dev"
		content {
			includeGroup "net.adriantodt.fabricmc"
		}
	}
	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	maven {
		url = "https://maven.shedaniel.me"
	}
	maven {
		url = "https://maven.terraformersmc.com"
	}
	maven {
		name = "TeamResourceful"
		url = "https://maven.teamresourceful.com/repository/maven-releases"
	}
	maven {
		name = "JourneyMap"
		url = "https://jm.gserv.me/repository/maven-public"
	}
	maven {
		url = "https://maven.uuid.gg/releases"
	}
	maven {
		url "https://jitpack.io"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Apoli dependency
	modImplementation "dev.overgrown.apoli:apoli:${project.apoli_maven_version}"
	include "dev.overgrown.apoli:apoli:${project.apoli_maven_version}"

	// Trinkets dependency (Optional)
	modCompileOnly "dev.emi:trinkets:${trinkets_version}"

	// Icarae Origin
	modCompileOnly "dev.cammiescorner.icarus:Icarus-Fabric:${icarus_version}"
	modCompileOnly "dev.upcraft.origins.icarae:Icarae-Origin-Fabric:${icarae_origin_version}"
	// Icarae Origin (runtime)
	modLocalRuntime "dev.cammiescorner.icarus:Icarus-Fabric:${icarus_version}"
	modLocalRuntime "dev.upcraft.origins.icarae:Icarae-Origin-Fabric:${icarae_origin_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
